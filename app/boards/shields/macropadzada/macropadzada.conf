CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

# Usa oscilador RC interno no lugar do cristal 32kHz externo (para clones com cristal marginal)
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# Aumenta potência do TX BLE para +8dBm (nice_nano v2 suporta)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Driver para encoders EC11
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y